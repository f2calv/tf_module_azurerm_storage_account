name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: read

  validate:
    needs: versioning
    uses: f2calv/gha-workflows/.github/workflows/terraform.yml@v1
    with:
      command: validate
      working-directory: src
      azure-login: false
      expected-release-tag: ${{ needs.versioning.outputs.major }}.${{ needs.versioning.outputs.minor }}.${{ needs.versioning.outputs.patch }}
    permissions:
      contents: read
      id-token: write

  storage-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: terraform init -backend=false
        run: terraform init -backend=false -input=false

      - name: terraform test
        run: terraform test -no-color

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [versioning, lint, validate, storage-tests]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
