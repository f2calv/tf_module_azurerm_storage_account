name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .github/dependabot.yml
      - LICENSE
      - README.md
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
    permissions:
      contents: read

  validate:
    needs: versioning
    uses: f2calv/gha-workflows/.github/workflows/terraform.yml@v1
    with:
      command: validate
      working-directory: src
      azure-login: false
      expected-release-tag: v${{ needs.versioning.outputs.major }}.${{ needs.versioning.outputs.minor }}.${{ needs.versioning.outputs.patch }}
    permissions:
      contents: read

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [versioning, lint, validate]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
    permissions:
      contents: write
